<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survivor Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130E;
    --panel: #241C14;
    --panel-light: #2E2418;
    --line: #4A3520;
    --text: #EFE1C0;
    --muted: #A6906B;
    --accent: #E8A33D;   /* torch gold */
    --g1: #E8621A;       /* orange tribe */
    --g2: #4C7A54;       /* green tribe */
    --g3: #5B7FA6;       /* blue tribe */
    --elim: #7A1F1F;     /* snuffed torch */
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #241C14 0%, #17130E 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    font-feature-settings: "tnum" 1, "lnum" 1;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 980px; margin: 0 auto; padding: 32px 20px 60px; }

  .hero{
    margin-bottom: 30px; padding-bottom: 22px;
    border-bottom: 3px solid var(--line);
    position: relative;
  }
  .hero::after{
    content: '';
    position:absolute; left:0; right:0; bottom:-3px; height:3px;
    background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 30px);
    opacity:0.6;
  }
  .hero h1{
    font-family:'Rye', serif; font-weight:400; font-size: clamp(32px, 6.5vw, 58px);
    margin:0; line-height:1; letter-spacing: 1px;
    color: var(--accent);
    text-shadow: 0 2px 0 #5a2f0f, 0 4px 10px rgba(0,0,0,0.5);
  }
  .hero .sub{ color: var(--muted); font-size: 14px; margin-top: 10px; letter-spacing:0.2px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: inset 0 0 0 1px rgba(239,225,192,0.03), 0 6px 14px rgba(0,0,0,0.25);
    padding: 20px; margin-bottom: 22px;
  }
  .panel h2{
    font-family:'Rye', serif; font-weight:400; font-size: 22px; letter-spacing:0.5px;
    margin: 0 0 6px; color: var(--accent);
  }
  .panel .desc{ color: var(--muted); font-size: 13px; margin-bottom: 14px; font-style: italic; }
  .panel label{ display:block; font-size: 12px; color: var(--muted); margin: 10px 0 5px; text-transform: lowercase; }
  .panel input[type=number], .panel select{
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    padding: 9px 11px; font-size: 14px; font-family: inherit;
  }
  .panel button{
    background: var(--accent); color: #17130E; border: none; padding: 10px 20px; font-size: 14px; font-weight:700;
    cursor: pointer; font-family: inherit; margin-top: 12px;
    box-shadow: 0 3px 0 #8a5a1c;
  }
  .panel button:hover{ filter: brightness(1.08); }
  .panel button:active{ box-shadow: 0 1px 0 #8a5a1c; transform: translateY(2px); }
  .week-row{ display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  .week-row .num-field{ width: 90px; flex: none; }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin-top: 14px; }
  .weekchip{ background: var(--bg); border: 1px solid var(--line); padding: 6px 12px; font-size: 12px; display:flex; align-items:center; gap:8px; }
  .weekchip button{ all: unset; cursor:pointer; color: var(--muted); font-size: 13px; margin:0; padding:0; }
  .weekchip button:hover{ color: var(--elim); }

  .status{ color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.error{ color: #D9736C; }
  .status.ok{ color: var(--g2); }

  .assign-row{ display:flex; align-items:center; gap:12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .assign-row:last-child{ border-bottom: none; }
  .assign-row .name{ flex:1; font-size: 14px; }
  .assign-row .name .team{ font-weight:600; }
  .assign-row .name .owner{ color: var(--muted); font-size: 12px; }
  .chip-set{ display:flex; gap:6px; flex-wrap: wrap; }
  .chip{
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 5px 12px; font-size: 12px; cursor:pointer; font-family: inherit; font-weight:600;
  }
  .chip.on0{ background: var(--g1); color:#17130E; border-color: var(--g1); }
  .chip.on1{ background: var(--g2); color:#17130E; border-color: var(--g2); }
  .chip.on2{ background: var(--g3); color:#17130E; border-color: var(--g3); }
  .chip.on3{ background: var(--elim); color:#EFE1C0; border-color: var(--elim); }
  .chip.elim-chip{ opacity: 0.8; }

  .groups{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 800px){ .groups{ grid-template-columns: 1fr; } }
  .group-card{
    background: var(--panel-light); border-top: 4px solid var(--muted); padding: 20px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  }
  .group-card.gi0{ border-top-color: var(--g1); }
  .group-card.gi1{ border-top-color: var(--g2); }
  .group-card.gi2{ border-top-color: var(--g3); }
  .group-card .gname{
    background: transparent; border: none; color: var(--text); font-family:'Rye', serif;
    font-size: 20px; width:100%; padding: 0 0 4px; margin-bottom: 4px; letter-spacing:0.5px;
  }
  .group-card .gname:focus{ outline: none; border-bottom: 1px dashed var(--line); }
  .group-card .gavg{ font-family:'Rye', serif; font-size: 36px; margin: 4px 0 2px; line-height:1; }
  .group-card.gi0 .gavg{ color: var(--g1); }
  .group-card.gi1 .gavg{ color: var(--g2); }
  .group-card.gi2 .gavg{ color: var(--g3); }
  .group-card .gavg-lbl{ color: var(--muted); font-size: 11px; margin-bottom: 14px; }
  .team-row{ padding: 10px 0; border-top: 1px dashed var(--line); }
  .team-row:first-of-type{ border-top: none; }
  .team-row .top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .team-row .tname{ font-size: 13px; font-weight:600; }
  .team-row .towner{ font-size: 11px; color: var(--muted); }
  .team-row .tavg{ font-size: 15px; font-weight:700; }
  .team-row .tweeks{ font-size: 10px; color: var(--muted); }
  .team-row .voted-out-badge{
    display:inline-block; margin-left:8px; font-size: 9px; font-weight:700; letter-spacing:0.5px;
    text-transform: uppercase; color: var(--elim); border: 1px solid var(--elim);
    padding: 2px 6px; vertical-align: middle;
  }
  .team-row .votes-badge{
    display:inline-block; margin-left:8px; font-size: 9px; font-weight:700; letter-spacing:0.5px;
    text-transform: uppercase; color: var(--muted); border: 1px solid var(--line);
    padding: 2px 6px; vertical-align: middle;
  }
  .empty-note{ color: var(--muted); font-size: 12px; font-style: italic; padding: 10px 0; }

  .elim-panel h2{ color: var(--elim); }
  .elim-list{ display:flex; flex-wrap:wrap; gap: 10px; }
  .elim-tag{ background: var(--bg); border: 1px solid var(--elim); padding: 7px 14px; font-size: 12px; }
  .elim-tag .tname{ font-weight:600; text-decoration: line-through; text-decoration-color: var(--elim); }
  .elim-tag .towner{ color: var(--muted); font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>SURVIVOR FANTASY</h1>
    <div class="sub">Would be a real shame if Rosche was voted out</div>
  </div>

  <div class="panel" id="viewPanel">
    <h2>Viewing</h2>
    <div class="desc">Select which week you would like to view.</div>
    <label for="viewWeek">Week</label>
    <select id="viewWeek"></select>
  </div>

  <div id="groupsSection" class="groups"></div>

  <div class="panel elim-panel">
    <h2>Eliminated</h2>
    <div class="desc">The tribe has spoken.</div>
    <div class="elim-list" id="elimList"></div>
  </div>

</div>

<script>
const LEAGUE_ID = '1402753007057145856';

// Hardcoded from rosters + users endpoints. ownerId lets the site check
// Sleeper live for renamed teams (see loadLiveTeamNames below).
const TEAMS = [
  { rosterId: 1,  teamName: 'Kempter',                        ownerName: 'Kempter',                ownerId: '871464387993583616' },
  { rosterId: 2,  teamName: 'callgor',                         ownerName: 'callgor',                ownerId: '1136684797062938624' },
  { rosterId: 3,  teamName: 'Ericewittaspice10',               ownerName: 'Ericewittaspice10',      ownerId: '998676790321258496' },
  { rosterId: 4,  teamName: 'willdvincent',                    ownerName: 'willdvincent',           ownerId: '738515538455928832' },
  { rosterId: 5,  teamName: 'drewt1226',                       ownerName: 'drewt1226',              ownerId: '1130304589762297856' },
  { rosterId: 6,  teamName: 'BigFreeze59',                     ownerName: 'BigFreeze59',            ownerId: '605238579488182272' },
  { rosterId: 7,  teamName: 'Man Myth Legend rizgod',          ownerName: 'tburk11',                ownerId: '856206228391583744' },
  { rosterId: 8,  teamName: 'Camryn Allysa Floyd',             ownerName: 'wrosche',                ownerId: '1130345400600346624' },
  { rosterId: 9,  teamName: 'nbelknap12',                      ownerName: 'nbelknap12',             ownerId: '862486837028093952' },
  { rosterId: 10, teamName: 'Boston Rob Gronkowski',           ownerName: 'QBSeth',                 ownerId: '871099285750620160' },
  { rosterId: 11, teamName: 'Tanzims',                         ownerName: 'Tanzims',                ownerId: '568955740936044544' },
  { rosterId: 12, teamName: 'GerberBabyy',                     ownerName: 'GerberBabyy',            ownerId: '1099094063304884224' },
  { rosterId: 13, teamName: 'Jeff Probst',                     ownerName: 'Cwillbrand',             ownerId: '1004208886255022080' },
  { rosterId: 14, teamName: 'partypatty',                      ownerName: 'partypatty',             ownerId: '343502697690955776' },
  { rosterId: 15, teamName: 'George Rosche',                   ownerName: 'Swbix',                  ownerId: '740659900501397504' },
  { rosterId: 16, teamName: "Don't Get Nixed",                 ownerName: 'jonahmwilhelm',          ownerId: '1257481332645171200' },
  { rosterId: 17, teamName: 'owenchilly',                      ownerName: 'owenchilly',             ownerId: '992660870238904320' },
  { rosterId: 18, teamName: 'PapaSpang',                       ownerName: 'PapaSpang',              ownerId: '464570477046657024' },
  { rosterId: 19, teamName: 'Carson Beck Sole Survivor',       ownerName: 'CTWENGER',               ownerId: '864702590355681280' },
  { rosterId: 20, teamName: 'Daddy Devens',                    ownerName: 'nkoppert',               ownerId: '1268368677560909824' },
  { rosterId: 21, teamName: 'jackbeast2007',                   ownerName: 'jackbeast2007',          ownerId: '996968108059402240' },
];

// ---------------------------------------------------------------------------
// TRIBE CONFIG — edit these two constants and re-deploy to update tribes for
// everyone.
// ---------------------------------------------------------------------------
const DEFAULT_GROUP_NAMES = ["Tribe Called Quest","Sukondi","Pig Pen Wannabes"];
const DEFAULT_GROUP_OF = {
  "1": 2,
  "2": 1,
  "3": 0,
  "4": 2,
  "5": 2,
  "6": 1,
  "7": 1,
  "8": 2,
  "9": 0,
  "10": 0,
  "11": 1,
  "12": 1,
  "13": 0,
  "14": 1,
  "15": 0,
  "16": 2,
  "17": 0,
  "18": 2,
  "19": 2,
  "20": 0,
  "21": 1
};

// ---------------------------------------------------------------------------
// ELIMINATIONS — the week number here is the LAST week that team was still
// active (i.e. the week they got voted out after). They'll keep showing up
// under their tribe if that week or an earlier one is selected, but from the
// following week on they drop out of every tribe. They always appear in the
// Eliminated panel below regardless of which week is selected.
// ---------------------------------------------------------------------------
const ELIMINATED_WEEK = {
  "16": 1   // Don't Get Nixed — voted out week 1
};

// ---------------------------------------------------------------------------
// TRIBAL COUNCIL VOTES — how many votes each roster received, by week. Only
// rosters that received at least one vote need an entry. Shown as a small
// label next to their name when that week is selected.
// ---------------------------------------------------------------------------
const VOTES = {
  1: { "16": 6, "4": 1 }
};

// ---------------------------------------------------------------------------
// PAST WEEKS — hardcode completed weeks here so the site doesn't need to
// re-fetch history from Sleeper every load. Format matches Sleeper's own
// data: each week number maps to { rosterId: points }.
// The site automatically fetches whichever week comes right after the
// highest one listed here and treats that as the "active" week — so you
// only ever need to add finished weeks, never the current one.
// ---------------------------------------------------------------------------
const HARDCODED_WEEKS = {
  1: {
    "1": 131.98,
    "2": 102.62,
    "3": 101.1,
    "4": 91.82,
    "5": 94.2,
    "6": 122.66,
    "7": 145.12,
    "8": 84.86,
    "9": 105.84,
    "10": 109.26,
    "11": 87.16,
    "12": 122.4,
    "13": 102.86,
    "14": 72.84,
    "15": 50.62,
    "16": 57.76,
    "17": 82.6,
    "18": 125.44,
    "19": 91.54,
    "20": 136.14,
    "21": 100.04
  }
};

let weeksData = { ...HARDCODED_WEEKS }; // weekNum -> { rosterId: points }
let groupOf = { ...DEFAULT_GROUP_OF };
let groupNames = [ ...DEFAULT_GROUP_NAMES ];
let viewingWeek = null;    // the single week currently displayed

// The active week is always whichever week comes right after your highest
// hardcoded week — right now that's week 2. Once you hardcode week 2's
// results, this automatically becomes week 3, and so on.
const HARDCODED_WEEK_NUMS = Object.keys(HARDCODED_WEEKS).map(Number);
const ACTIVE_WEEK = HARDCODED_WEEK_NUMS.length ? Math.max(...HARDCODED_WEEK_NUMS) + 1 : 1;

let liveTeamNames = {}; // rosterId -> team name, only set if it differs from the hardcoded one

const $ = id => document.getElementById(id);

function setStatus(el, msg, cls){
  el.textContent = msg || '';
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function displayTeamName(t){
  return liveTeamNames[t.rosterId] || t.teamName;
}

// Checks Sleeper for each owner's current team_name and uses it if the
// person has renamed their team since we hardcoded TEAMS above.
async function loadLiveTeamNames(){
  try{
    const res = await fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/users`);
    if(!res.ok) return;
    const users = await res.json();
    if(!Array.isArray(users)) return;

    const nameByOwnerId = {};
    users.forEach(u => {
      const teamName = u.metadata && u.metadata.team_name;
      if(teamName) nameByOwnerId[u.user_id] = teamName;
    });

    TEAMS.forEach(t => {
      const live = nameByOwnerId[t.ownerId];
      if(live && live !== t.teamName) liveTeamNames[t.rosterId] = live;
    });

    renderAssignAndGroups();
  }catch(e){
    // if this fails, we just keep showing the hardcoded names — no big deal
  }
}

// A team is active in a tribe for a given week if it hasn't been eliminated
// yet as of that week (or was never eliminated at all).
function isActiveInWeek(rosterId, week){
  const elimAfter = ELIMINATED_WEEK[rosterId];
  if(elimAfter === undefined) return true;
  if(week === null) return true;
  return week <= elimAfter;
}

function init(){
  TEAMS.forEach((t, i) => {
    if(!(t.rosterId in groupOf)) groupOf[t.rosterId] = i % 3;
  });

  viewingWeek = ACTIVE_WEEK; // default to the active week, not just whatever last scored
  populateViewWeekSelect();
  renderAssignAndGroups();

  loadActiveWeek();
  loadLiveTeamNames();
}

// The dropdown always offers every hardcoded week plus the active week
// (even before it has scores), plus anything auto-fetched beyond that.
function dropdownWeeks(){
  const s = new Set([...HARDCODED_WEEK_NUMS, ACTIVE_WEEK, ...Object.keys(weeksData).map(Number)]);
  return Array.from(s).sort((a,b) => a-b);
}

function populateViewWeekSelect(){
  const sel = $('viewWeek');
  const weeks = dropdownWeeks();
  sel.innerHTML = '';
  weeks.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w;
    opt.textContent = w === ACTIVE_WEEK ? `Week ${w} (Active)` : `Week ${w}`;
    if(w === viewingWeek) opt.selected = true;
    sel.appendChild(opt);
  });
}
$('viewWeek').addEventListener('change', () => {
  viewingWeek = parseInt($('viewWeek').value, 10) || null;
  renderAssignAndGroups();
});

function applyWeekData(weekNum, matchups){
  const points = {};
  matchups.forEach(m => { points[m.roster_id] = m.points || 0; });
  weeksData[weekNum] = points;
}

async function loadActiveWeek(){
  for(let week = ACTIVE_WEEK; week <= 18; week++){
    try{
      const res = await fetch(`https://api.sleeper.app/v1/league/${LEAGUE_ID}/matchups/${week}`);
      if(!res.ok) continue;
      const matchups = await res.json();
      if(!Array.isArray(matchups) || matchups.length === 0) continue;
      const total = matchups.reduce((s, m) => s + (m.points || 0), 0);
      if(total <= 0) continue; // week hasn't scored yet
      applyWeekData(week, matchups);
    }catch(e){
      // network hiccup on this week — move on, don't block the rest
    }
  }

  // Refresh the dropdown (in case new weeks turned up) and re-render, but
  // never yank the view away from the active week once it's loaded.
  populateViewWeekSelect();
  renderAssignAndGroups();
}

function teamScores(rosterId){
  return Object.keys(weeksData)
    .map(Number).sort((a,b) => a-b)
    .map(w => weeksData[w][rosterId])
    .filter(p => p !== undefined);
}

// Score for whichever single week is currently selected — never blended with other weeks.
function teamScoreForViewingWeek(rosterId){
  if(viewingWeek === null || !weeksData[viewingWeek]) return undefined;
  return weeksData[viewingWeek][rosterId];
}

function avg(arr){ return arr.reduce((a,b) => a+b, 0) / arr.length; }

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderAssignAndGroups(){
  const groupsSection = $('groupsSection');
  groupsSection.innerHTML = '';
  for(let gi = 0; gi < 3; gi++){
    const card = document.createElement('div');
    card.className = `group-card gi${gi}`;

    const name = document.createElement('div');
    name.className = 'gname';
    name.textContent = groupNames[gi];
    card.appendChild(name);

    const groupTeams = TEAMS
      .filter(t => groupOf[t.rosterId] === gi && isActiveInWeek(t.rosterId, viewingWeek))
      .map(t => ({
        ...t,
        weekScore: teamScoreForViewingWeek(t.rosterId),
      }));
    const withScores = groupTeams.filter(t => t.weekScore !== undefined);

    const avgDiv = document.createElement('div');
    avgDiv.className = 'gavg';
    avgDiv.textContent = withScores.length ? avg(withScores.map(t => t.weekScore)).toFixed(1) : '--';
    card.appendChild(avgDiv);

    const lbl = document.createElement('div');
    lbl.className = 'gavg-lbl';
    lbl.textContent = viewingWeek !== null
      ? `avg score · week ${viewingWeek} · ${groupTeams.length} team${groupTeams.length===1?'':'s'}`
      : `no week selected · ${groupTeams.length} team${groupTeams.length===1?'':'s'}`;
    card.appendChild(lbl);

    if(groupTeams.length === 0){
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = 'No teams assigned yet.';
      card.appendChild(note);
    }else{
      groupTeams
        .slice()
        .sort((a,b) => (b.weekScore ?? -Infinity) - (a.weekScore ?? -Infinity))
        .forEach(t => {
          const row = document.createElement('div');
          row.className = 'team-row';
          const votedOutBadge = ELIMINATED_WEEK[t.rosterId] === viewingWeek
            ? '<span class="voted-out-badge">Voted Out</span>'
            : '';
          const votes = VOTES[viewingWeek] ? VOTES[viewingWeek][t.rosterId] : undefined;
          const votesBadge = votes !== undefined
            ? `<span class="votes-badge">${votes} vote${votes === 1 ? '' : 's'}</span>`
            : '';
          if(t.weekScore === undefined){
            row.innerHTML = `
              <div class="top">
                <div><div class="tname">${escapeHtml(displayTeamName(t))}${votedOutBadge}${votesBadge}</div><div class="towner">${escapeHtml(t.ownerName)}</div></div>
                <div class="tavg">--</div>
              </div>
            `;
          }else{
            row.innerHTML = `
              <div class="top">
                <div><div class="tname">${escapeHtml(displayTeamName(t))}${votedOutBadge}${votesBadge}</div><div class="towner">${escapeHtml(t.ownerName)}</div></div>
                <div class="tavg">${t.weekScore.toFixed(1)}</div>
              </div>
            `;
          }
          card.appendChild(row);
        });
    }

    groupsSection.appendChild(card);
  }

  const elimList = $('elimList');
  const elimTeams = TEAMS.filter(t => ELIMINATED_WEEK[t.rosterId] !== undefined);
  elimList.innerHTML = elimTeams.length ? '' : '<div class="empty-note">No teams eliminated yet.</div>';
  elimTeams.forEach(t => {
    const tag = document.createElement('div');
    tag.className = 'elim-tag';
    tag.innerHTML = `<span class="tname">${escapeHtml(displayTeamName(t))}</span><span class="towner">${escapeHtml(t.ownerName)}</span>`;
    elimList.appendChild(tag);
  });
}

init();
</script>
</body>
</html>
